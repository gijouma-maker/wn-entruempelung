const UI_IDX={de:0,en:1,tr:2,ar:3,ru:4,es:5,fr:6,nl:7};
function uiLang(){try{return localStorage.getItem("wn_ui_lang")||st.data.profil?.[st.me]?.lang||"de"}catch(e){return"de"}}
const uiNorm=s=>String(s).replace(/\s+/g," ").trim();
const uiKey=s=>uiNorm(s).replace(/[-+−]?\d[\d.,:]*/g,"#");
function uiDict(lang){const i=UI_IDX[lang];if(!i)return null;const D=window.WN_UI||{},x=(st.uiExtra||{})[lang]||{};return k=>{const a=D[k];if(a&&a[i-1])return a[i-1];return x[k]||null}}
function uiFill(tpl,orig){const nums=uiNorm(orig).match(/[-+−]?\d[\d.,:]*/g)||[];let i=0;return tpl.replace(/##/g,"\x01#").replace(/#/g,()=>nums[i++]??"#").replace(/\x01/g,"#")}
const UI_ORIG=new WeakMap(),UI_SKIP="script,style,textarea,input,svg,[contenteditable],.no-ui,#sq,#vcT";
let uiMissing=new Set(),uiBusy=false;
function uiTranslateNode(root){
  if(st.role==="kunde")return;const lang=uiLang();if(lang==="de"&&!document.body.__uiWasTr)return;
  const look=uiDict(lang);
  const doText=n=>{if(n.parentElement&&n.parentElement.closest(UI_SKIP))return;let o=UI_ORIG.get(n);const cur=n.nodeValue;
    if(o==null||(cur!==o.tr&&cur!==o.de)){o={de:cur,tr:null};UI_ORIG.set(n,o)}
    const s=uiNorm(o.de);if(!s||!/[A-Za-zÄÖÜäöüß]{2}/.test(s))return;
    if(lang==="de"){if(cur!==o.de)n.nodeValue=o.de;return}
    const k=uiKey(s),t=look&&look(k);
    if(t){const v=o.de.replace(s,uiFill(t,s));o.tr=v;if(cur!==v)n.nodeValue=v}else if(UI_VOCAB.has(k))uiMissing.add(k)};
  const doAttr=el=>{for(const a of ["placeholder","aria-label","title"]){const v=el.getAttribute(a);if(!v)continue;const ka="__ui_"+a;let d=el[ka];if(d==null||(v!==d&&v!==el[ka+"t"])){d=v;el[ka]=d}
    if(lang==="de"){if(v!==d)el.setAttribute(a,d);continue}const k=uiKey(d),t=look&&look(k);if(t){const tv=uiFill(t,d);el[ka+"t"]=tv;if(v!==tv)el.setAttribute(a,tv)}else if(UI_VOCAB.has(k))uiMissing.add(k)}};
  if(root.nodeType===3){doText(root);return}
  if(root.nodeType!==1)return;
  if(root.closest&&root.closest(UI_SKIP))return;
  doAttr(root);root.querySelectorAll?.("[placeholder],[aria-label],[title]").forEach(doAttr);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())doText(n);
  if(uiMissing.size)uiAiSoon();
}

function colOnce(c){return new Promise(ok=>{let fertig=false,un=null;const ende=o=>{if(fertig)return;fertig=true;ok(o);setTimeout(()=>{try{typeof un==="function"&&un()}catch(e){}},0)};
  try{un=st.db.collection(c).onSnapshot(s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});ende(o)},()=>ende({}))}catch(e){ende({})}setTimeout(()=>ende({}),15000)})}
function idKand(v,k,set){if(typeof v==="string"){if(/id|foto|bild|logo|datei|scan|sig|unterschr|anhang|doc|pdf|nachweis/i.test(k||"")&&/^[A-Za-z0-9_-]{4,120}$/.test(v)&&!/^\d+$/.test(v))set.add(v);return}

const b64Blob=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]||"");r.onerror=no;r.readAsDataURL(b)});

/* ---------- Start ---------- */
render();
(async()=>{
  const C=window.claude;
  if(!C||!C.use){st.role="kunde";render();return}
  const [db,user,assets,sample,dl,dict]=await Promise.all(["db","user","assets","sample","downloads","dictation"].map(n=>C.use(n).catch(()=>null)));
  st.db=db;st.user=user;st.assets=assets;st.sample=sample;st.dl=dl;st.dict=dict;
  let owner=false,edit=false;
  try{owner=!!(await user?.isOwner());edit=!!(await user?.canEdit());st.me=await user?.id()}catch(e){}
  st.realRole=owner?"chef":(edit?"mitarbeiter":"kunde");st.role=st.realRole;st.tab=owner?"start":"tickets";
  if(owner)$("#roleBar").classList.remove("hide");
  if(db){
    db.doc("einstellungen/firma").onSnapshot(s=>{st.firma=s.exists?s.data():{};render()},()=>{});
    db.doc("einstellungen/kasse").onSnapshot(s=>{st.kasse=s.exists?s.data():{};render()},()=>{});
    db.doc("einstellungen/belegregeln").onSnapshot(s=>{st.bregeln=s.exists?s.data():{}},()=>{});
    uiLoadShared(uiLang());
  }
  if(!db||st.realRole==="kunde"){render();return}
  const timer=setTimeout(()=>{st.slow=true;render()},10000);
  const pending=new Set(["tickets","belege","einnahmen","personen"]);
  for(const c of pending){
    db.collection(c).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]={...d.data(),_id:d.id}});st.data[c]=o;
      if(!snap.metadata.fromCache&&pending.delete(c)&&!pending.size){clearTimeout(timer)}
      st.loaded=true;resolveNames();render();
    },err=>{clearTimeout(timer);st.loaded=true;render()});
  }
  /* Personal */
  const hrSub=(c)=>db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]={...d.data(),_id:d.id}});st.data[c]=o;render()},()=>{});
  const hrDoc=(c,k)=>db.doc(c+"/"+k).onSnapshot(s=>{const o={...st.data[c]};if(s.exists)o[k]={...s.data(),_id:k};else delete o[k];st.data[c]=o;render()},()=>{});
  ["team","urlaub","urlaubok","status"].forEach(hrSub);
  if(owner)["profil","vertraege","vbest","zeiten","krank"].forEach(hrSub);
  else if(st.me)["profil","vertraege","vbest","zeiten","krank"].forEach(c=>hrDoc(c,st.me));
  /* sich selbst im Team eintragen (einmal pro Besuch) */
  if(st.me){try{await db.collection("personen").doc(st.me).set({rolle:st.realRole,zuletzt:nowIso()})}catch(e){}}
})();
async function resolveNames(){
  if(!st.user?.profiles)return;
  const ids=new Set();list("personen").forEach(p=>ids.add(p._id));list("tickets").forEach(t=>{(t.zugewiesen||[]).forEach(i=>ids.add(i));(t.fotos||[]).forEach(f=>f.von&&ids.add(f.von))});list("belege").forEach(b=>b.von&&ids.add(b.von));
  const need=[...ids].filter(i=>i&&!st.names[i]);if(!need.length)return;
  try{const ps=await st.user.profiles(need);let ch=false;for(const i of need){const n=ps?.[i]?.name;if(n){st.names[i]=n;ch=true}}if(ch)render()}catch(e){}
}
