<style>

:root{--page:#06080B;--bg:#0B0D11;--bgTop:#1B2230;--s1:#161A21;--s2:#12161D;--s3:#1F2530;--ink:#E5E7EB;--head:#FFFFFF;--mu:#9CA3AF;--soft:#AAB3C0;--cap:#C9CFD8;--line:#2A3240;--line2:#3A4352;
  --acc:#2563EB;--acc2:#1D4ED8;--accL:#93C5FD;--accBg:#0F2547;--onAcc:#FFFFFF;--logo:#D6DBE2;--logoAcc:#3B82F6;--okBg:#12321F;--okText:#4ADE80;--r:16px;

*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bgTop) 0%,var(--bg) 480px) var(--bg) no-repeat;color:var(--ink);font-family:Inter,"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}

.spread{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}

.steps{display:flex;gap:4px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--s3)}

.vl{border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.vl div small{color:var(--mu);display:block;font-size:11.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:start}
th{color:var(--mu);font-size:12px;font-weight:600}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.ai{display:flex;gap:10px;align-items:center;background:var(--accBg);color:var(--accL);border-radius:12px;padding:10px 12px;font-size:13.5px}
.spin{width:16px;height:16px;border:2px solid var(--accL);border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prev{max-height:280px;width:100%;object-fit:contain;border-radius:12px;background:var(--s2)}
.rolesw{border:1px solid var(--line);background:var(--s1);border-radius:22px;height:40px;padding:0 10px;color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qb{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;text-align:center}
.qb svg{width:24px;height:24px;color:var(--accL)}
.qb.main{background:var(--acc);border-color:var(--acc);color:var(--onAcc);grid-column:1/-1;flex-direction:row;justify-content:center;font-size:15px;font-weight:700}
.qb.main svg{color:var(--onAcc)}
.acts{display:flex;gap:6px;flex:none}
.rbtn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--s1);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none}
.rbtn[aria-pressed=true]{background:var(--accBg);color:var(--accL);border-color:var(--acc)}
.rbtn svg:not([width="20"]){border-radius:3px}
@media(max-width:420px){.top .t{display:none}}
.knav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);max-width:none;background:var(--bar);border-top:1px solid var(--s3);padding:4px 6px calc(8px + env(safe-area-inset-bottom))}
.knav button{background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer}
.knav button[aria-current=page]{color:var(--accL);font-weight:800}
.khero{display:flex;flex-direction:column;gap:12px;overflow:hidden}
.kheroimg{display:block;margin:-16px -16px 0;width:calc(100% + 32px);height:150px;border:0;padding:0;background:var(--s2);cursor:zoom-in}
.kheroimg img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.kh1{font-family:Montserrat,sans-serif;font-weight:800;font-size:24px;line-height:1.22;white-space:pre-line;color:var(--head)}
.krow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.krow2 .btn{min-height:46px}
.kcap{font-family:Montserrat,sans-serif;font-weight:800;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;color:var(--cap);margin:6px 0 -2px}
.kgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ktile{min-height:88px;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11.5px;font-weight:600;text-align:center;padding:10px 6px;cursor:pointer;hyphens:auto}
.ktile svg{color:var(--accL)}
.kgal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.kgi{flex:none;width:72%;max-width:300px;scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--s1);padding:0;display:flex;flex-direction:column;text-align:start;color:var(--ink);cursor:zoom-in}
.kgi img{width:100%;height:150px;object-fit:cover;display:block}
.kgi span{padding:8px 12px;font-size:12.5px;font-weight:600}
.kib{width:40px;height:40px;border-radius:12px;background:var(--accBg);color:var(--accL);display:grid;place-items:center;flex:none}
.kfs{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.kfs legend{font-size:12px;font-weight:600;color:var(--cap);margin-bottom:8px;padding:0}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:21px;border:1px solid var(--line2);background:var(--s1);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer}
.kchip.on{background:var(--accBg);border-color:var(--acc);color:var(--accL)}
.kstep{display:flex;align-items:center;border:1px solid var(--line2);border-radius:12px;background:var(--s1);height:46px}
.kstep button{width:46px;height:44px;border:0;background:none;color:var(--accL);font-size:22px;cursor:pointer}
.kstep span{flex:1;text-align:center;font-weight:700;color:var(--head)}
.kswitch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.kswitch input{width:24px;height:24px;flex:none;accent-color:var(--acc)}
.kmode{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kmode button{border:1px solid var(--line2);background:var(--s1);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);cursor:pointer}
.kmode button svg{color:var(--accL)}
.kmode button[aria-pressed=true],.ktimes button[aria-pressed=true]{background:var(--accBg);border-color:var(--acc);color:var(--accL)}
.kdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.kday{border:1px solid var(--line);background:var(--s1);border-radius:10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);cursor:pointer;padding:2px}
.kday small{font-size:10px;color:var(--mu)}
.kday b{font-size:15px}
.kday.on{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}.kday.on small{color:var(--onAcc)}
.kday[disabled]{opacity:.35;cursor:default}
.ktimes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ktimes button{min-height:44px;border:1px solid var(--line2);background:var(--s1);border-radius:10px;font-weight:700;color:var(--ink);cursor:pointer}
.ktl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ktl li{display:flex;align-items:center;gap:12px;color:var(--mu)}

.ktl li.ok{color:var(--head)}.ktl li.ok .kdot{background:var(--acc);border-color:var(--acc);color:var(--onAcc)}
.ktl li.now{color:var(--accL)}.ktl li.now .kdot{border-color:var(--acc)}
.kkv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}

.kthemes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kthm{border:1px solid var(--line);background:var(--s1);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;color:var(--ink);cursor:pointer;font-weight:600;text-align:start}
.kthm[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.kpv{height:56px;border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:7px;border:1px solid rgba(127,127,127,.35)}
.kpv i{display:block;height:16px;border-radius:5px}.kpv b{display:block;height:9px;width:55%;border-radius:5px}
.rolebar{max-width:780px;margin:0 auto;padding:0 16px 10px}
.rolebar .in{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line)}
.rolebar button{min-height:38px;border:0;border-radius:10px;background:transparent;color:var(--soft);font-weight:700;font-size:13.5px;cursor:pointer}
.rolebar button[aria-pressed=true]{background:var(--acc);color:var(--onAcc)}
.today{display:grid;gap:8px}
.tp{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tp i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line2)}
.tp i.on{background:#22C55E}.tp i.ab{background:#F59E0B}.tp i.ur{background:var(--accL)}
.tp b{flex:1;color:var(--head);font-weight:600}
.hide{display:none!important}
.scan-strip{display:flex;gap:8px;overflow-x:auto}.scan-strip:empty{display:none}
.scan-strip .sp{position:relative;flex:0 0 84px;height:112px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--s2)}
.scan-strip.one .sp{flex:1 1 auto;height:auto;min-height:200px;max-height:46vh}.scan-strip img{width:100%;height:100%;object-fit:cover}.scan-strip.one img{object-fit:contain;max-height:46vh}
.scan-strip .sp.busy img{filter:brightness(.35)}.spin-w{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:4px}.spin-w small{font-size:10.5px}

.scan-strip .sp .rb.del{right:4px;font-size:15px}.scan-strip .sp .rb.rot{left:4px}.scan-strip .sp .rb.org{left:32px;font-size:10.5px}
.scan-strip .sp span{position:absolute;left:6px;bottom:6px;background:#fff;color:#000;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.scan-cam{min-height:64px;font-size:16px;gap:10px;justify-content:center;display:flex;align-items:center;width:100%}
</style>
</head>
<body>
<header><div class="top">
  <div class="logo"><svg viewBox="170 50 700 300" role="img" aria-label="WN Entrümpelung"><path style="fill:var(--logoAcc)" d="M470,330 C300,352 160,322 178,250 C192,200 258,170 330,160 C252,192 214,238 230,278 C250,318 352,330 470,330 Z"/><path style="fill:var(--logo)" d="M540,130 V88 H564 V144"/><polyline points="228,172 420,60 612,172" style="fill:none;stroke:var(--logo)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><rect style="fill:var(--logo)" x="404" y="98" width="13" height="13"/><rect style="fill:var(--logo)" x="420" y="98" width="13" height="13"/><rect style="fill:var(--logo)" x="404" y="114" width="13" height="13"/><rect style="fill:var(--logo)" x="420" y="114" width="13" height="13"/><text style="fill:var(--logo)" x="420" y="318" text-anchor="middle" font-family="Montserrat,Arial Black,sans-serif" font-weight="900" font-size="190" letter-spacing="-8">WN</text><rect style="fill:var(--logo)" x="604" y="178" width="158" height="122" rx="6"/><path style="fill:var(--logo)" d="M766,212 H818 L854,256 V300 H766 Z"/><circle cx="646" cy="304" r="22" style="fill:var(--bg);stroke:var(--logo)" stroke-width="7"/><circle cx="814" cy="304" r="22" style="fill:var(--bg);stroke:var(--logo)" stroke-width="7"/></svg><span class="logo-sub">ENTRÜMPELUNG</span></div>
  <div class="t"><h1 id="title">Aufträge</h1><small id="sub">WN Entrümpelung</small></div>
  <div class="acts" id="acts"></div>
</div>
<div class="rolebar hide" id="roleBar" role="group" aria-label="Ansicht wählen"></div></header>
<main id="main"><div class="empty">App wird geladen …</div></main>
<nav class="tabs hide" id="nav"><div class="in" id="navIn"></div></nav>
<div class="backdrop" id="bd"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="picker" class="hide" accept="image/*">
<input type="file" id="pickerM" class="hide" accept="image/*" multiple>

<script src="wn-server.js"></script>
<script src="github-modus.js"></script>
<script src="i18n.js"></script>
<script src="flags.js"></script>
<script src="recht.js"></script>
<script src="ui-i18n.js"></script>
<script>
"use strict";
/* ---------- Konstanten ---------- */
const STATUS=["Neu","Angebot gesendet","Angenommen","In Arbeit","Erledigt","Bezahlt","Abgelehnt"];
const OFFEN=["Neu","Angebot gesendet","Angenommen","In Arbeit"];
const QUELLE=["Kleinanzeigen","Marktplaats","Facebook","Telefon","WhatsApp","Empfehlung","Sonstiges"];
const LEISTUNG=["Entrümpelung","Haushaltsauflösung","Büroauflösung","Wohnungsräumung","Keller/Dachboden","Entsorgung","Transport","Umzug","Sperrmüll-Abholung","Gartenarbeit","Reinigung","Sonstiges"];
const KAT=["Kraftstoff","Fahrzeug (Reparatur/Wartung)","Werkzeug/Geräte","Material/Verbrauch","Entsorgung/Deponie","Fremdleistung/Aushilfen","Werbung/Anzeigen","Telefon/Internet","Bürobedarf","Bewirtung","Versicherung","Miete/Lager","Sonstiges"];
const FOTOTYP=["Vorher","Nachher","Während","Schaden","Nachweis","Sonstiges"];
const ZAHLART=["Bar","Überweisung","Karte","PayPal"];
const MONATE=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];

/* ---------- Zustand ---------- */
const st={db:null,assets:null,sample:null,dl:null,user:null,me:null,realRole:"kunde",role:"kunde",
  data:{tickets:{},belege:{},einnahmen:{},personen:{},team:{},profil:{},vertraege:{},vbest:{},zeiten:{},urlaub:{},urlaubok:{},status:{},krank:{}},openMa:null,maTab:"vertrag",firma:{},names:{},
  tab:"start",tf:"offen",year:String(new Date().getFullYear()),loaded:false,slow:false,openTicket:null};

/* ---------- Helfer ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowIso=()=>new Date().toISOString();
const fD=s=>{if(!s)return"";const[y,m,d]=String(s).slice(0,10).split("-");return d?`${d}.${m}.${y}`:s};
const fDT=s=>{if(!s)return"";const t=String(s).slice(11,16);return fD(s)+(t?` · ${t}`:"")};
const eur=n=>(Number(n)||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(",","."));return isNaN(n)?null:n};
const list=c=>Object.values(st.data[c]);
const blob=id=>id?(window.__wnBlob?window.__wnBlob(id):"/_blob/"+encodeURIComponent(id)):"";
const isChef=()=>st.role==="chef";
const nameOf=uid=>uid?(st.names[uid]||"Mitarbeiter"):"";
const webUrl=()=>{let w=String(st.firma.web||"gijouma-maker.github.io/wn-entruempelung").trim();if(!w)return"";if(!/^https?:\/\//i.test(w))w="https://"+w;return w};
const WEB_DEFAULT="gijouma-maker.github.io/wn-entruempelung";
const webShow=()=>String(st.firma.web||WEB_DEFAULT).trim().replace(/^https?:\/\//i,"").replace(/\/$/,"");
const webLine=l=>webShow()?(l==="nl"?`Meer over ons, foto's van eerdere klussen en contact: ${webShow()}`:`Mehr über uns, Bilder von früheren Aufträgen und Kontakt: ${webShow()}`):"";
const withWeb=(txt,l)=>{const w=webLine(l);if(!w||String(txt).includes(webShow()))return txt;return String(txt).trim()+"\n\n"+w};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}
function openSheet(h){$("#sheet").innerHTML=h;$("#bd").classList.add("open")}
function closeSheet(){$("#bd").classList.remove("open");$("#sheet").innerHTML="";st.openMa=null}
$("#bd").addEventListener("click",e=>{if(e.target.id==="bd")closeSheet()});
function waNum(p){let d=String(p||"").replace(/[^\d+]/g,"");if(d.startsWith("+"))d=d.slice(1);else if(d.startsWith("00"))d=d.slice(2);else if(d.startsWith("0"))d="49"+d.slice(1);return d.replace(/\D/g,"")}
const waLink=(p,t)=>`https://wa.me/${waNum(p)}?text=${encodeURIComponent(t)}`;
async function copy(t){try{await navigator.clipboard.writeText(t);toast("Kopiert")}catch(e){toast("Kopieren nicht möglich – Text bitte markieren")}}
function stCls(s){return s==="Neu"?"neu":(["Angebot gesendet","Angenommen","In Arbeit"].includes(s)?"akt":"")}
function mwstOf(brutto,satz){const b=Number(brutto)||0,s=Number(satz)||0;return Math.round((b-b/(1+s/100))*100)/100}

/* Bild verkleinern (spart Speicher, schneller für KI) */
async function shrink(file,max=1600){
  try{const bm=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bm.width,bm.height));
    const c=document.createElement("canvas");c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
    c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));}catch(e){return file}
}
function pickImage(){return new Promise(res=>{const p=$("#picker");p.value="";p.onchange=()=>res(p.files[0]||null);p.click()})}
async function upload(file){if(!st.assets)throw new Error("Fotos hochladen ist in dieser Ansicht nicht möglich");const b=await shrink(file);const r=await st.assets.upload(b);return r.id}

/* ---------- KI ---------- */
function parseJson(t){const m=String(t).match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null}
async function ki(prompt,images){
  if(!st.sample)throw new Error("KI ist in dieser Ansicht nicht verfügbar");
  const opts=images?{images}:{};
  try{if(st.sample.json){const v=await st.sample.json(prompt,opts);if(v&&typeof v==="object")return v}}catch(e){if(e&&e.code==="not_granted")throw e}
  const r=await st.sample(prompt,opts);return parseJson(r.text);
}
async function kiText(prompt){if(!st.sample)throw new Error("KI ist in dieser Ansicht nicht verfügbar");const r=await st.sample(prompt);return String(r.text||"").trim()}

/* ---------- Daten schreiben ---------- */
async function save(col,id,data){const ref=id?st.db.collection(col).doc(id):st.db.collection(col).doc();await ref.set(data);return ref.id}
async function upd(col,id,data){await st.db.collection(col).doc(id).update(data)}
async function logT(id,text,extra={}){const t=st.data.tickets[id];if(!t)return;const verlauf=[...(t.verlauf||[]),{t:nowIso(),text,von:st.me}].slice(-150);await upd("tickets",id,{...extra,verlauf})}
function nextNr(){return Math.max(1000,...list("tickets").map(t=>Number(t.nr)||0))+1}

/* ---------- Navigation ---------- */
const IC={
 start:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
 tickets:'<path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4z"/><path d="M15 5v2M15 11v2M15 17v2"/>',
 belege:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 geld:'<path d="M4 19h16"/><path d="M4 15l4-6 4 2 4-5 4 4"/>',
 team:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5"/>',
 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 zeit:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 urlaub:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 15l2 2 4-4"/>',
 ich:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>'
};
const svg=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
function tabsFor(r){
  if(r==="chef")return[["start","Start"],["tickets","Tickets"],["belege","Belege"],["geld","Finanzen"],["team","Team"]];
  if(r==="mitarbeiter")return[["tickets","Aufträge"],["zeit","Zeit"],["urlaub","Urlaub/Krank"],["belege","Belege"],["ich","Ich"]];
  return[];
}
function renderNav(){
  const t=tabsFor(st.role);$("#nav").classList.toggle("hide",!t.length);
  const neu=list("tickets").filter(x=>x.status==="Neu").length;
  $("#navIn").innerHTML=t.map(([k,l])=>`<button data-act="tab" data-tab="${k}" ${st.tab===k?'aria-current="page"':""}>${svg(k)}${l}${k==="tickets"&&neu&&isChef()?`<span class="badge">${neu}</span>`:""}</button>`).join("");
}

/* ---------- Render ---------- */
function render(){
  renderNav();renderActs();
  const m=$("#main");
  if(st.role==="kunde"){const [ti,su]=kTitle();$("#title").textContent=ti;$("#sub").textContent=su;m.dir=kLang().dir||"ltr";document.documentElement.lang=st.k.lang;m.innerHTML=vKunde();return}
  m.dir="ltr";document.documentElement.lang="de";
  if(!st.db){m.innerHTML=`<div class="note">Die Datenbank ist in dieser Ansicht nicht erreichbar. Bitte die App über den Link in Claude öffnen und angemeldet sein.</div>`;return}
  if(!st.loaded){m.innerHTML=`<div class="empty">${st.slow?"Daten sind noch nicht erreichbar – bitte Internetverbindung prüfen.":"Daten werden geladen …"}</div>`;return}
  const T={start:["Übersicht",()=>startHint()+vHeute()+vStart()],tickets:[isChef()?"Tickets":"Meine Aufträge",vTickets],belege:["Belege",vBelege],geld:["Finanzen",vGeld],team:["Team & Firma",vTeam],zeit:["Arbeitszeit",()=>vHeute()+vZeit()],urlaub:["Urlaub & Krankmeldung",vUrlaub],ich:["Mein Bereich",vIch]};
  const [ti,fn]=T[st.tab]||T.tickets;$("#title").textContent=ti;$("#sub").textContent=(st.firma.name||"WN Entrümpelung")+" · "+({chef:"Chef",mitarbeiter:"Mitarbeiter"}[st.role]);
  m.innerHTML=fn();if(st.tab==="team"&&isChef())showLogoPrev();try{uiApply()}catch(e){}
  if(st.openTicket&&st.data.tickets[st.openTicket]&&$("#bd").classList.contains("open")&&$("#sheet [data-tk]"))openTicket(st.openTicket,true);
  if(st.openMa&&$("#bd").classList.contains("open")&&$("#sheet [data-ma]")&&!$("#sheet").contains(document.activeElement&&document.activeElement.matches("input,textarea,select")?document.activeElement:null))openMa(st.openMa);
}

/* Start (Chef) */
function monthSum(ym){
  const ein=list("einnahmen").filter(e=>String(e.datum).startsWith(ym)).reduce((a,e)=>a+(Number(e.brutto)||0),0);
  const aus=aktiv("belege").filter(b=>String(b.datum).startsWith(ym)).reduce((a,b)=>a+(Number(b.brutto)||0),0);
  return{ein,aus};
}
function startHint(){const o=allUrlaub().filter(a=>a.status==="beantragt").length,run=[],kr=teamList().filter(t=>krankNow(t._id)),ue=offeneRechnungen().filter(x=>x.ueber>0).length;return (o||kr.length||ue)?`<div class="card" style="display:flex;flex-direction:column;gap:6px">${ue?`<button class="btn" data-act="tab" data-tab="geld" style="border-color:#f59e0b">${ue} überfällige Rechnung${ue>1?"en":""} – Erinnerung senden</button>`:""}${o?`<button class="btn" data-act="tab" data-tab="team">${o} offene${o===1?"r":""} Urlaubsantr${o===1?"ag":"äge"} prüfen</button>`:""}${kr.length?`<div class="small">Krank gemeldet: ${kr.map(t=>esc(t.name)).join(", ")}</div>`:""}</div>`:""}
function vStart(){
  const t=list("tickets"),ym=today().slice(0,7),ms=monthSum(ym);
  const c=s=>t.filter(x=>x.status===s).length;
  const neu=t.filter(x=>x.status==="Neu").sort((a,b)=>String(b.erstellt).localeCompare(a.erstellt)).slice(0,5);
  return `<div class="quick">
    <button class="qb main" data-act="newTicket">${svg("plus")}Neues Ticket</button>
    <button class="qb" data-act="fromAd">${svg("link")}Aus Anzeige übernehmen</button>
    <button class="qb" data-act="fromWa">${svg("tickets")}Aus Kunden-Anfrage</button>
    <button class="qb" data-act="scan">${svg("cam")}Beleg fotografieren</button>
    <button class="qb" data-act="voice">${svg("tickets")}Sprachassistent (KI)</button>
    <button class="qb" data-act="suche">${svg("tickets")}Suchen</button>
    <button class="qb" data-act="tab" data-tab="geld">${svg("geld")}Steuerberater-Export</button>
  </div>
  <div class="kpis">
    <button class="kpi" data-act="tf" data-v="Neu"><b>${c("Neu")}</b><span>Neue Anfragen</span></button>
    <button class="kpi" data-act="tf" data-v="Angebot gesendet"><b>${c("Angebot gesendet")}</b><span>Angebot offen</span></button>
    <button class="kpi" data-act="tf" data-v="In Arbeit"><b>${c("Angenommen")+c("In Arbeit")}</b><span>Angenommen / in Arbeit</span></button>
    <button class="kpi" data-act="tf" data-v="Erledigt"><b>${c("Erledigt")}</b><span>Erledigt, nicht bezahlt</span></button>
  </div>
  <div class="card"><div class="spread"><h3>${MONATE[new Date().getMonth()]} ${new Date().getFullYear()}</h3><button class="btn sm" data-act="tab" data-tab="geld">Finanzen →</button></div>
    <div class="kpis" style="margin-top:10px;grid-template-columns:repeat(3,1fr)">
      <div><b style="font-size:20px;font-weight:300">${eur(ms.ein)}</b><div class="small">Einnahmen</div></div>
      <div><b style="font-size:20px;font-weight:300">${eur(ms.aus)}</b><div class="small">Ausgaben</div></div>
      <div><b style="font-size:20px;font-weight:300">${eur(ms.ein-ms.aus)}</b><div class="small">Ergebnis</div></div>
    </div></div>
  <div class="spread"><h2>Neue Anfragen</h2><button class="btn sm" data-act="tab" data-tab="tickets">Alle Tickets →</button></div>
  <div class="list">${neu.length?neu.map(tItem).join(""):`<div class="empty">Keine neuen Anfragen. Übernehmen Sie eine Anzeige von Kleinanzeigen, Marktplaats oder Facebook mit „Aus Anzeige übernehmen“.</div>`}</div>`;
}

/* Tickets */
function tItem(t){
  const fotos=(t.fotos||[]).length,who=(t.zugewiesen||[]).map(nameOf).join(", ");
  return `<div class="item" data-act="openTicket" data-id="${esc(t._id)}" role="button" tabindex="0">
    <div class="head"><b>#${esc(t.nr)} · ${esc(t.titel||t.leistung||"Auftrag")}</b><span class="pill ${stCls(t.status)}">${esc(t.status)}</span></div>
    ${t.problem?.offen?`<div class="small" style="color:#f59e0b">⚠ ${esc(t.problem.grund)}</div>`:""}
    <div class="meta">${esc([t.kunde?.name,t.kunde?.ort].filter(Boolean).join(" · "))}${t.quelle?` · ${esc(t.quelle)}`:""}</div>
    <div class="meta">${t.termin?`Termin ${esc(fDT(t.termin))} · `:""}${t.angebot?`Angebot ${eur(t.angebot)} · `:""}${fotos?`${fotos} Fotos · `:""}${who?`👷 ${esc(who)}`:"nicht zugewiesen"}</div>
  </div>`;
}
function vTickets(){
  let t=list("tickets");
  if(!isChef())t=t.filter(x=>(x.zugewiesen||[]).includes(st.me)||st.tf==="alle");
  const f=st.tf;
  const flt=f==="offen"?t.filter(x=>OFFEN.includes(x.status)):(f==="alle"?t:t.filter(x=>x.status===f));
  flt.sort((a,b)=>String(a.termin||"9").localeCompare(String(b.termin||"9"))||String(b.erstellt).localeCompare(a.erstellt));
  const segs=isChef()?[["offen","Offen"],...STATUS.map(s=>[s,s]),["alle","Alle"]]:[["offen","Meine offenen"],["Erledigt","Erledigt"],["alle","Alle Aufträge"]];
  return `${isChef()?`<div class="row"><button class="btn pri" data-act="newTicket">${svg("plus").replace("<svg","<svg width=16 height=16")} Neues Ticket</button><button class="btn" data-act="fromAd">Aus Anzeige übernehmen</button></div>`:""}
  <div class="seg">${segs.map(([k,l])=>`<button data-act="tf" data-v="${esc(k)}" aria-pressed="${f===k}">${esc(l)}</button>`).join("")}</div>
  <div class="list">${flt.length?flt.map(tItem).join(""):`<div class="empty">${isChef()?"Keine Tickets in dieser Ansicht.":"Ihnen ist gerade kein Auftrag zugewiesen."}</div>`}</div>`;
}
function ticketForm(t={}){
  const k=t.kunde||{};
  return `<div class="fields">
   <div class="field full"><label>Titel</label><input id="f_titel" value="${esc(t.titel||"")}" placeholder="z. B. Kellerentrümpelung 30 m²"></div>
   <div class="field"><label>Leistung</label><select id="f_leistung">${LEISTUNG.map(o=>`<option${o===t.leistung?" selected":""}>${o}</option>`).join("")}</select></div>
   <div class="field"><label>Quelle</label><select id="f_quelle">${QUELLE.map(o=>`<option${o===t.quelle?" selected":""}>${o}</option>`).join("")}</select></div>
   <div class="field"><label>Kunde Name</label><input id="f_kname" value="${esc(k.name||"")}"></div>
   <div class="field"><label>Telefon / WhatsApp</label><input id="f_ktel" type="tel" value="${esc(k.tel||"")}"></div>
   <div class="field"><label>Ort</label><input id="f_kort" value="${esc(k.ort||"")}"></div>
   <div class="field"><label>Adresse</label><input id="f_kadr" value="${esc(k.adresse||"")}"></div>
   <div class="field"><label>Termin</label><input id="f_termin" type="datetime-local" value="${esc(t.termin||"")}"></div>
   <div class="field"><label>Angebot € (brutto)</label><input id="f_angebot" type="number" step="0.01" value="${t.angebot??""}"></div>
   <div class="field"><label>Kunde ist</label><select id="f_typ"><option value="privat"${t.kundeTyp!=="firma"?" selected":""}>Privatkunde (Widerrufsrecht)</option><option value="firma"${t.kundeTyp==="firma"?" selected":""}>Firma / Hausverwaltung</option></select></div>
   <div class="field"><label>Land</label><select id="f_land"><option value="DE"${istNL(t)?"":" selected"}>Deutschland</option><option value="NL"${istNL(t)?" selected":""}>Niederlande</option></select></div>
   <div class="field"><label>Sprache der Dokumente</label><select id="f_spr"><option value="">automatisch</option><option value="de"${t.sprache==="de"?" selected":""}>Deutsch</option><option value="nl"${t.sprache==="nl"?" selected":""}>Niederländisch</option></select></div>
   <div class="field"><label>E-Mail Kunde</label><input id="f_kmail" type="email" value="${esc(k.email||"")}"></div>
   <div class="field"><label>USt-IdNr. / btw-nummer (nur Firmen)</label><input id="f_kust" value="${esc(k.ustid||"")}"></div>
   <div class="field full"><label>Link zur Anzeige</label><input id="f_link" value="${esc(t.anzeigeLink||"")}" placeholder="https://www.kleinanzeigen.de/…"></div>
   <div class="field full"><label>Beschreibung</label><textarea id="f_besch">${esc(t.beschreibung||"")}</textarea></div>
  </div>`;
}
function readTicketForm(){
  const v=id=>$("#"+id).value.trim();
  return{titel:v("f_titel"),leistung:v("f_leistung"),quelle:v("f_quelle"),kundeTyp:v("f_typ")||"privat",land:v("f_land")||"DE",sprache:v("f_spr"),kunde:{name:v("f_kname"),tel:v("f_ktel"),ort:v("f_kort"),adresse:v("f_kadr"),email:v("f_kmail"),ustid:v("f_kust")},
    termin:v("f_termin"),angebot:num(v("f_angebot")),anzeigeLink:v("f_link"),beschreibung:v("f_besch")};
}
function newTicket(pre){
  openSheet(`<div class="spread"><h2>Neues Ticket</h2><button class="btn sm" data-act="close">Schließen</button></div>${ticketForm(pre||{})}
  <div class="row" style="justify-content:flex-end"><button class="btn pri" data-act="saveNew">Ticket anlegen</button></div>`);
}
async function saveNew(){
  const d=readTicketForm();if(!d.titel&&!d.kunde.name){toast("Bitte Titel oder Kunde eintragen");return}
  const ein=st.pendingConsent;st.pendingConsent=null;const id=await save("tickets",null,{...d,...(ein?{einwilligung:ein}:{}),nr:nextNr(),status:"Neu",zugewiesen:[],fotos:[],erstellt:nowIso(),erstelltVon:st.me,verlauf:[{t:nowIso(),text:"Ticket angelegt"+(d.quelle?` (Quelle: ${d.quelle})`:""),von:st.me}]});

}

async function adGo(){
  const text=$("#adText").value.trim();if(!text){toast("Bitte Anzeigentext einfügen");return}
  $("#adOut").innerHTML=`<div class="ai"><span class="spin"></span>KI liest die Anzeige …</div>`;
  try{
    const r=await ki(`Du hilfst einer Entrümpelungsfirma (${st.firma.name||"WN Entrümpelung"}, Raum Nordhorn, auch Niederlande). Lies diese Kleinanzeige und antworte NUR mit JSON:
{"titel":"kurzer Titel","leistung":"eins aus ${LEISTUNG.join("|")}","quelle":"eins aus ${QUELLE.join("|")}","kunde_name":"","ort":"","beschreibung":"Zusammenfassung was zu tun ist, Umfang, Besonderheiten","sprache":"de oder nl","angebot_text":"kurze, freundliche, persönliche Antwort an den Inserenten in seiner Sprache: Interesse bekunden, 1-2 Rückfragen (z. B. Fotos, Etage, Aufzug, Menge), Besichtigung anbieten, keine Preise erfinden"}
Anzeige:
"""${text.slice(0,6000)}"""`);

    const pre={titel:r.titel,leistung:LEISTUNG.includes(r.leistung)?r.leistung:"Entrümpelung",quelle:QUELLE.includes(r.quelle)?r.quelle:(/marktplaats/i.test(text)?"Marktplaats":"Kleinanzeigen"),
      kunde:{name:r.kunde_name||"",ort:r.ort||""},beschreibung:r.beschreibung||"",anzeigeLink:$("#adLink").value.trim()};

    newTicket(pre);
    $("#sheet").insertAdjacentHTML("beforeend",`<div class="card" style="background:var(--s2)"><h3>Antwort-Entwurf an den Inserenten</h3><p class="small">Bitte prüfen, anpassen und selbst über die Plattform schicken.</p><div class="field"><textarea id="adDraft" style="min-height:120px">${esc(st.adDraft)}</textarea></div><div class="row"><button class="btn sm" data-act="copyDraft">Text kopieren</button></div></div>`);

async function setStatus(id,s,force){
  const t=st.data.tickets[id];if(!t||t.status===s)return;
  if(s==="Bezahlt"){payDialog(id);return}
  if(s==="In Arbeit"&&!force){const w=startWarnungen(t);if(w.length&&st.warnOk!==id){st.warnOk=id;toast("Achtung: "+w.join(" ")+" Nochmal tippen = trotzdem starten.");return}st.warnOk=null;if(w.length)await logT(id,"Gestartet trotz Hinweis: "+w.join(" "))}
  if(s==="Erledigt"&&!force&&!(t.fotos||[]).some(f=>f.typ==="Nachher")){
    if(!isChef()){toast("Bitte zuerst ein Nachher-Foto der fertigen Arbeit machen");st.fotoTyp="Nachher";st.afterFoto={id,s};await addFoto(id);return}
    toast("Hinweis: Es gibt noch kein Nachher-Foto");
  }
  await logT(id,`Status: ${t.status} → ${s}`,{status:s});toast("Status: "+s);
}

async function payGo(id){
  const t=st.data.tickets[id],b=num($("#p_b").value),d=$("#p_d").value,z=$("#p_z").value,m=num($("#p_m").value)||0;
  if(!b){toast("Bitte Betrag eintragen");return}
  if(istFest(d)){toast("Dieser Monat ist festgeschrieben – bitte Zahlungsdatum prüfen");return}
  const kk=t.rechnung?.kalk||t.kalk,fac=kk&&kk.zahlbetrag?b/kk.zahlbetrag:0;
  const anteile=kk?{arbeit35a:r2(kk.anteil35a*fac),arbeit:r2(kk.anteil.arbeit*fac),fahrt:r2(kk.anteil.fahrt*fac),entsorgung:r2(kk.anteil.entsorgung*fac),material:r2(kk.anteil.material*fac),wertanrechnung:r2(kk.wert||0)}:null;
  await save("einnahmen","t_"+id,{datum:d,brutto:b,mwstSatz:m,mwst:mwstOf(b,m),beschreibung:`#${t.nr} ${t.titel||t.leistung||""} · ${t.kunde?.name||""}`.trim(),ticketId:id,zahlart:z,erstellt:nowIso(),von:st.me,...(anteile?{anteile}:{}),...(t.rechnung?{rechnungNr:t.rechnung.nr}:{})});
  await logT(id,`Bezahlt: ${eur(b)} (${z})`,{status:"Bezahlt",preisFinal:b,bezahltAm:d,zahlart:z});
  toast("Einnahme verbucht");openTicket(id);
}

const SIGTYP={abnahme:"Abnahme (Arbeiten erledigt)",uebergabe:"Übergabeprotokoll (besenrein)",auftrag:"Auftragserteilung",vollmacht:"Vollmacht (Erbe, Betreuer, Bevollmächtigte)",nachtrag:"Nachtrag (Mehrkosten)"};
function sigText(t,typ){
  if(typ==="uebergabe")return uebergabeText(t,sigEx());
  if(typ==="vollmacht")return vollmachtText(t,vmEx());
  if(typ==="nachtrag")return nachtragText(t,ntEx());
  const k=t.kunde||{},f=st.firma,firma=f.name||"WN Entrümpelung",preis=t.preisFinal??t.angebot;
  const was=[t.leistung,t.titel].filter(Boolean).join(" – ")||"Auftrag";
  if(typ==="auftrag")return `Ich beauftrage ${firma} mit folgendem Auftrag: ${was}${k.adresse||k.ort?` (${[k.adresse,k.ort].filter(Boolean).join(", ")})`:""}${t.termin?`, Termin ${fDT(t.termin)}`:""}${preis?`, zum Preis von ${eur(preis)} ${f.kleinunternehmer?"(gemäß § 19 UStG ohne MwSt.)":"inkl. MwSt."}`:""}, wie in diesem Auftrag #${t.nr} beschrieben.`+(istPrivat(t)?wrZusatz(t,wrEx()):"");
  return `Ich bestätige, dass die Arbeiten aus Auftrag #${t.nr} (${was}) am ${fD(today())} vollständig und ordnungsgemäß ausgeführt wurden. Ich nehme die Leistung hiermit ab.`;
}
async function sha256(txt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return""}}

/* ---------- PDF-Auftragsprotokoll ---------- */
function loadJsPdf(){
  if(window.jspdf)return Promise.resolve();
  return new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res();sc.onerror=()=>rej(new Error("PDF-Modul konnte nicht geladen werden"));document.head.appendChild(sc)});
}
async function imgData(id,max=1400){
  const r=await fetch(blob(id));if(!r.ok)throw new Error("Bild fehlt");const bm=await createImageBitmap(await r.blob());
  const sc=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bm,0,0,c.width,c.height);
  return{data:c.toDataURL("image/jpeg",.82),w:c.width,h:c.height};
}
async function makePdf(id){
  const t=st.data.tickets[id];if(!t)return;
  toast("PDF wird erstellt …");
  await loadJsPdf();
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});
  const f=st.firma,firma=f.name||"WN Entrümpelung",k=t.kunde||{},W=210,M=16,CW=W-2*M;let y=M;
  const need=h=>{if(y+h>PDF_END){doc.addPage();y=M}};
  const H=(txt)=>{need(12);y+=3;doc.setFont("helvetica","bold");doc.setFontSize(11.5);doc.text(txt,M,y);y+=2;doc.setDrawColor(0);doc.setLineWidth(.3);doc.line(M,y,W-M,y);y+=5;doc.setFont("helvetica","normal");doc.setFontSize(10)};
  const P=(txt,size=10)=>{doc.setFontSize(size);const ls=doc.splitTextToSize(String(txt),CW);for(const l of ls){need(5);doc.text(l,M,y);y+=size*.42+.6}};
  const R=(lab,val)=>{if(!val)return;doc.setFontSize(10);const ls=doc.splitTextToSize(String(val),CW-42);need(ls.length*4.8+1);doc.setTextColor(90);doc.text(lab,M,y);doc.setTextColor(0);doc.text(ls,M+42,y);y+=ls.length*4.8+.8};
  /* Kopf */
  y=await pdfHead(doc,`Auftragsprotokoll #${t.nr}`,`Erstellt am ${new Date().toLocaleString("de-DE",{dateStyle:"medium",timeStyle:"short"})}`)-5;
  H("Auftrag");
  R("Kunde",k.name);R("Adresse",[k.adresse,k.ort].filter(Boolean).join(", "));R("Telefon",k.tel);
  R("Leistung",t.leistung);R("Titel",t.titel);R("Termin",t.termin?fDT(t.termin):"");R("Status",t.status);
  R("Team",(t.zugewiesen||[]).map(nameOf).join(", "));
  if(isChef()){const p=t.preisFinal??t.angebot;if(p)R(t.preisFinal?"Endpreis":"Angebot",`${eur(p)} ${f.kleinunternehmer?"(gemäß § 19 UStG ohne MwSt.)":"inkl. MwSt."}`)}
  R("Quelle",t.quelle);if(t.einwilligung)R("Einwilligung",`Datenspeicherung zugestimmt am ${t.einwilligung.am}`);
  if(t.beschreibung){H("Beschreibung");P(t.beschreibung)}
  /* Fotos */
  const fotos=(t.fotos||[]).slice().sort((a,b)=>String(a.t).localeCompare(b.t));
  if(fotos.length){
    H(`Fotos (${fotos.length})`);
    const cw=(CW-6)/2,maxH=62;let col=0,rowH=0;
    for(const ph of fotos){
      let im;try{im=await imgData(ph.id)}catch(e){continue}
      let w=cw,h=w*im.h/im.w;if(h>maxH){h=maxH;w=h*im.w/im.h}
      if(col===0){need(maxH+10);rowH=0}
      const x=M+col*(cw+6);doc.addImage(im.data,"JPEG",x,y,w,h);
      doc.setFontSize(8);doc.setTextColor(90);doc.text(doc.splitTextToSize(`${ph.typ} · ${fDT(ph.t)} · ${nameOf(ph.von)}${ph.notiz?" · "+ph.notiz:""}`,cw),x,y+h+3.5);doc.setTextColor(0);
      rowH=Math.max(rowH,h+8);
      if(col===1){y+=rowH+2;col=0}else col=1;
    }
    if(col===1)y+=rowH+2;
  }
  /* Unterschriften */
  const sg=t.signaturen||[];
  H("Unterschriften");
  if(!sg.length)P("Noch keine Unterschrift vorhanden.");
  for(const x of sg){
    need(58);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(SIGTYP[x.typ]||x.typ,M,y);doc.setFont("helvetica","normal");y+=5;
    P(x.text,9.5);if(x.anm)P("Anmerkung des Kunden: "+x.anm,9.5);y+=1;
    try{const im=await imgData(x.id,900);let w=70,h=w*im.h/im.w;if(h>28){h=28;w=h*im.w/im.h}need(h+14);doc.addImage(im.data,"JPEG",M,y,w,h);y+=h+1}catch(e){}
    doc.setDrawColor(150);doc.line(M,y,M+80,y);y+=4;
    doc.setFontSize(9.5);doc.text(`${x.name} · ${fDT(x.t)}`,M,y);y+=4.2;
    doc.setFontSize(7.5);doc.setTextColor(110);
    doc.text(doc.splitTextToSize(`Elektronisch unterschrieben am Gerät${x.von?` von ${nameOf(x.von)}`:""}, ${new Date(x.t).toLocaleString("de-DE")}.${x.hash?` Prüfsumme (SHA-256): ${x.hash}`:""}`,CW),M,y);
    doc.setTextColor(0);y+=9;
  }
  /* Fußzeile */
  const n=doc.getNumberOfPages();
  void n;pdfFoot(doc,`Auftrag #${t.nr}`);
  const name=`Auftragsprotokoll_${t.nr}_${(k.name||"Kunde").replace(/[^\wäöüÄÖÜß-]+/g,"_")}.pdf`,pdf=doc.output("blob");
  try{if(st.dl){await st.dl.save({filename:name,data:pdf})}else doc.save(name)}catch(e){try{doc.save(name)}catch(e2){toast("Download abgebrochen");return}}
  await logT(id,"PDF-Protokoll erstellt");
}

function planBar(a){const s=new Date(a.von.slice(0,7)+"-01T12:00:00"),days=new Date(s.getFullYear(),s.getMonth()+1,0).getDate();const d1=Number(a.von.slice(8,10)),d2=a.bis.slice(0,7)===a.von.slice(0,7)?Number(a.bis.slice(8,10)):days;return `<div style="position:relative;height:8px;border-radius:4px;background:var(--s3);margin-top:4px" aria-hidden="true"><span style="position:absolute;top:0;bottom:0;left:${(d1-1)/days*100}%;width:${(d2-d1+1)/days*100}%;border-radius:4px;background:${a.status==="genehmigt"?"var(--acc)":"var(--accL)"};opacity:${a.status==="genehmigt"?1:.55}"></span></div>`}

function vZeit(k){

    <button class="btn sm" data-act="zAdd" style="align-self:center">Zeit nachtragen</button></div>`:""}
  <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi" style="cursor:default"><b>${hrs(wk)}</b><span>diese Woche</span></div><div class="kpi" style="cursor:default"><b>${hrs(sumM)}</b><span>${MONATE[new Date().getMonth()]} ${new Date().getFullYear()}</span></div></div>

function sigPad(c){
  const dpr=Math.max(1,window.devicePixelRatio||1);let drawn=false,down=false,last=null;
  const clear=()=>{c.width=Math.round(c.clientWidth*dpr);c.height=Math.round(c.clientHeight*dpr);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.lineCap="round";g.lineJoin="round";g.strokeStyle="#111";g.lineWidth=2.6*dpr;drawn=false};
  requestAnimationFrame(clear);
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]};
  c.onpointerdown=e=>{e.preventDefault();down=true;last=pos(e);try{c.setPointerCapture(e.pointerId)}catch(_){}};
  c.onpointermove=e=>{if(!down)return;e.preventDefault();const p=pos(e),g=c.getContext("2d");g.beginPath();g.moveTo(last[0],last[1]);g.lineTo(p[0],p[1]);g.stroke();last=p;drawn=true};
  c.onpointerup=c.onpointercancel=()=>{down=false};
  return{clear,drawn:()=>drawn,blob:()=>new Promise(r=>c.toBlob(r,"image/png"))};
}

  const rows=tl.map(t=>{const k=t._id,s=doc("status",k)||{},a=absOf(k);let cls="",txt="nicht angemeldet";
    if(s.arbeitet&&s.pause){cls="ab";txt=`macht Pause seit ${fT(s.pauseSeit)} Uhr`}
    else if(s.arbeitet){cls="on";txt=`arbeitet seit ${fT(s.seit)} Uhr`}
    else if(a){const kr=isChef()?krankNow(k):null;cls=a.typ==="abwesend"?"ab":"ur";txt=kr?`krank gemeldet${kr.bis?` bis ${fD(kr.bis)}`:""}${kr.au?" · AU liegt vor":" · AU fehlt"}`:a.typ==="abwesend"?`abwesend${a.bis?` bis ${fD(a.bis)}`:""}`:`${a.typ} bis ${fD(a.bis)}`}
    return `<div class="tp"><i class="${cls}" aria-hidden="true"></i><b>${esc(t.name)}${k===meKey()?" (Sie)":""}</b><span class="small">${esc(txt)}</span></div>`}).join("");
  return `${noTitle?"":`<h2 class="kcap">Heute im Team</h2>`}<div class="today">${rows}</div><p class="small" style="margin:0">Grün: arbeitet · Orange: Pause oder abwesend · Blau: Urlaub. ${isChef()?"Nur Sie sehen, wer krank ist.":"Ob jemand krank ist, sieht nur der Chef."}</p>`;
}

  $("#b_b").oninput=sync;$("#b_s").onchange=sync;

function yearData(y){
  const e=list("einnahmen").filter(x=>String(x.datum).startsWith(y)),a=aktiv("belege").filter(x=>String(x.datum).startsWith(y));
  const m=MONATE.map((_,i)=>{const ym=`${y}-${pad(i+1)}`;const ee=e.filter(x=>String(x.datum).startsWith(ym)),aa=a.filter(x=>String(x.datum).startsWith(ym));
    return{ein:ee.reduce((s,x)=>s+(+x.brutto||0),0),einU:ee.reduce((s,x)=>s+(+x.mwst||0),0),aus:aa.reduce((s,x)=>s+(+x.brutto||0),0),ausV:aa.reduce((s,x)=>s+(+x.mwst||0),0)}});
  const kat={};a.forEach(x=>belegSplits(x).forEach(sp=>{kat[sp.kategorie]=(kat[sp.kategorie]||0)+sp.brutto}));
  return{e,a,m,kat};
}

function csv(){
  const y=st.year,mo=$("#exM")?.value||"",pre=mo?`${y}-${mo}`:y;
  const q=s=>`"${String(s??"").replace(/"/g,'""')}"`,n=v=>(Number(v)||0).toFixed(2).replace(".",",");
  const base=location.origin;
  const rows=[["Datum","Art","Beschreibung","Kategorie","Konto SKR03 (Vorschlag)","Brutto","MwSt-Satz","MwSt","Netto","Zahlart","Auftrag","Rechnungs-Nr","davon Arbeit/Fahrt §35a (brutto)","Entsorgung (brutto)","Material (brutto)","Beleg-Link","Erfasst von"]];
  const nr=x=>x.ticketId&&st.data.tickets[x.ticketId]?"#"+st.data.tickets[x.ticketId].nr:"";
  list("einnahmen").filter(x=>String(x.datum).startsWith(pre)).forEach(x=>rows.push([fD(x.datum),"Einnahme",x.beschreibung,"Erlöse",kontoErloes(x.mwstSatz),n(x.brutto),x.mwstSatz??"",n(x.mwst),n((+x.brutto||0)-(+x.mwst||0)),x.zahlart,nr(x),x.rechnungNr||"",x.anteile?n(x.anteile.arbeit35a):"",x.anteile?n(x.anteile.entsorgung):"",x.anteile?n(x.anteile.material):"","",nameOf(x.von)]));
  aktiv("belege").filter(x=>String(x.datum).startsWith(pre)).forEach(x=>{
    const txt=[x.haendler,x.notiz].filter(Boolean).join(" – "),link=x.bildId?base+blob(x.bildId):"";
    belegSplits(x).forEach(sp=>{if(sp.brutto)rows.push([fD(x.datum),"Ausgabe",txt+(x.positionen?.length?` (${x.positionen.filter(p=>!p.privat&&p.kategorie===sp.kategorie&&Number(p.satz)===Number(sp.satz)).map(p=>p.text).join(", ").slice(0,120)})`:""),sp.kategorie,SKR[sp.kategorie]||"4900",n(sp.brutto),sp.satz,n(sp.mwst),n(sp.brutto-sp.mwst),x.zahlart,nr(x),"","","","",link,nameOf(x.von)])});
    if(+x.privat)rows.push([fD(x.datum),/Firm|Überweisung/.test(x.zahlart||"")?"Privatentnahme":"Privat (nicht erstattet)",txt+" – privat: "+(x.positionen||[]).filter(p=>p.privat).map(p=>p.text).join(", ").slice(0,120),"Privat",/Firm|Überweisung/.test(x.zahlart||"")?KONTO_PRIVAT:"",n(x.privat),"","","",x.zahlart,nr(x),"","","","",link,nameOf(x.von)]);
  });
  const body=[rows[0],...rows.slice(1).sort((a,b)=>a[0].split(".").reverse().join("").localeCompare(b[0].split(".").reverse().join("")))];
  return{name:`WN_Buchhaltung_${pre}.csv`,text:"﻿"+body.map(r=>r.map(q).join(";")).join("\r\n"),count:rows.length-1};

function parseAnfrage(txt){
  const T=String(txt||"").replace(/\r/g,"");if(!/Name:/i.test(T))return null;
  const g=k=>{const m=T.match(new RegExp("^\\s*"+k+":[ \\t]*(.*)$","im"));const v=m?m[1].trim():"";return v==="-"?"":v};
  const ok=/Einwilligung:\s*ja/i.test(T);
  const am=(T.match(/Einwilligung:\s*ja[^\n]*?(\d{2}\.\d{2}\.\d{4}(?:,? \d{1,2}:\d{2})?)/i)||[])[1]||"";
  const blocks=T.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  const free=blocks.slice(1).filter(b=>!/^(Einwilligung:|\(Fotos)/i.test(b)&&!/^\w[\w\/ ]*:/.test(b)&&b!=="-").join("\n");
  const wt=g("Wunschtermin"),dm=wt.match(/(\d{2})\.(\d{2})\.(\d{4})/),uz=(g("Uhrzeit").match(/\d{1,2}:\d{2}/)||[])[0]||"09:00";
  let lst=g("Leistung");if(!LEISTUNG.includes(lst))lst="Entrümpelung";
  const extra=[["Leistungen",g("Leistungen")],["Objekt",g("Objekt")],["Etage/Aufzug",g("Etage\\/Aufzug")],["Volumen",g("Volumen")],["Besichtigung",g("Besichtigung")],["Sprache",g("Sprache")]].filter(x=>x[1]).map(x=>x[0]+": "+x[1]);
  const adr=g("Adresse"),ort=g("Ort")||((adr.match(/\d{4,5}\s+[^,\d]+$/)||[])[0]||"").trim();
  return{ok,am,name:g("Name"),tel:g("Telefon"),adresse:adr,ort,leistung:lst,
    termin:dm?`${dm[3]}-${dm[2]}-${dm[1]}T${uz.padStart(5,"0")}`:"",besch:[free,...extra].filter(Boolean).join("\n")};
}

  const p=preise(),satz=k.rc?0:mwstSatzFirma(),pos=[];
  const m3=Math.max(0,num(k.m3)||0),pers=Math.max(1,num(k.personen)||2),std=Math.max(0,num(k.stunden)||0),et=Math.max(0,num(k.etagen)||0);

/* ---------- Belege: Positionen, Privatanteil, MwSt getrennt ---------- */
function posCalc(ps){
  const biz=ps.filter(p=>!p.privat),pv=ps.filter(p=>p.privat);
  const brutto=r2(biz.reduce((s,p)=>s+(+p.brutto||0),0)),privat=r2(pv.reduce((s,p)=>s+(+p.brutto||0),0));
  const mwst=r2(biz.reduce((s,p)=>s+mwstOf(p.brutto,p.satz),0));
  const byK={};biz.forEach(p=>{byK[p.kategorie]=(byK[p.kategorie]||0)+(+p.brutto||0)});
  const kat=Object.entries(byK).sort((a,b)=>b[1]-a[1])[0]?.[0]||"Sonstiges";
  const satz=Object.entries(biz.reduce((o,p)=>(o[p.satz]=(o[p.satz]||0)+(+p.brutto||0),o),{})).sort((a,b)=>b[1]-a[1])[0]?.[0];
  return{brutto,privat,gesamt:r2(brutto+privat),mwst,kategorie:kat,satz:satz!=null?Number(satz):19};
}
/* Aufteilung eines Belegs nach Kategorie + MwSt-Satz (nur betrieblich) */
function belegSplits(b){
  if(!b.positionen?.length)return[{kategorie:b.kategorie||"Sonstiges",satz:b.mwstSatz??19,brutto:+b.brutto||0,mwst:+b.mwst||0}];
  const g={};b.positionen.filter(p=>!p.privat).forEach(p=>{const key=p.kategorie+"|"+p.satz;g[key]=g[key]||{kategorie:p.kategorie,satz:Number(p.satz)||0,brutto:0,mwst:0};g[key].brutto=r2(g[key].brutto+(+p.brutto||0));g[key].mwst=r2(g[key].mwst+mwstOf(p.brutto,p.satz))});
  return Object.values(g);
}

  openSheet(`<div class="spread"><h2>Sprachassistent</h2><button class="btn sm" data-act="close">Schließen</button></div>
  <p class="small" style="margin:0">Einfach sagen, was zu tun ist – z. B. „Neuer Auftrag Frau Meyer, Nordhorn Bahnhofstraße 5, Keller ca. 15 Kubik, Donnerstag 10 Uhr“, „Notiz zu 1012: Kunde will die Küche behalten“, „Auftrag 1012 ist erledigt“ oder „Wie viel Umsatz haben wir diesen Monat?“</p>
  ${st.dict?`<button class="btn pri big" id="vcMic" data-act="vcMic">🎤 Sprechen</button>`:`<div class="small">Tipp: Tippen Sie ins Feld und benutzen Sie das Mikrofon auf der Handy-Tastatur.</div>`}
  <div class="field"><textarea id="vcT" style="min-height:110px" placeholder="Gesprochener oder getippter Text …"></textarea></div>
  <button class="btn big" data-act="vcGo">Mit KI ausführen</button><div id="vcOut"></div>`);
}
async function vcMic(btn){
  const d=st.dict;if(!d)return;
  if(st.dictOn){try{await d.stop()}catch(e){}return}
  let base=$("#vcT").value.trim();
  const p=d.start();st.dictOn=true;btn.textContent="■ Stopp – ich höre zu …";
  if(!st.dictWired){st.dictWired=true;
    d.onPartial(({text})=>{const el=$("#vcT");if(el)el.value=(st.dictBase?st.dictBase+" ":"")+text});
    d.onFinal(({text})=>{st.dictBase=((st.dictBase||"")+" "+text).trim();const el=$("#vcT");if(el)el.value=st.dictBase});
    d.onState(({state})=>{if(state==="idle"){st.dictOn=false;const b=$("#vcMic");if(b)b.textContent="🎤 Sprechen";if(st.dictBase&&$("#vcT"))vcGo()}});}
  st.dictBase=base;
  p.catch(e=>{st.dictOn=false;btn.textContent="🎤 Sprechen";toast(e&&e.code==="not_granted"?"Mikrofon nicht erlaubt – bitte tippen":"Mikrofon nicht verfügbar – bitte tippen")});
}
async function vcGo(){
  const txt=$("#vcT")?.value.trim();if(!txt){toast("Bitte etwas sagen oder tippen");return}
  $("#vcOut").innerHTML=`<div class="ai"><span class="spin"></span>KI versteht …</div>`;
  const chef=isChef(),ym=today().slice(0,7),ms=monthSum(ym);
  const tk=list("tickets").filter(t=>chef||(t.zugewiesen||[]).includes(st.me)).sort((a,b)=>b.nr-a.nr).slice(0,40).map(t=>`#${t.nr} | ${t.titel||t.leistung||""} | ${t.kunde?.name||""} | ${t.kunde?.ort||""} | ${t.status}${t.termin?" | Termin "+t.termin:""}`).join("\n");
  try{
    const r=await ki(`Du bist der Sprachassistent der Team-App einer Entrümpelungsfirma. Heute ist ${new Date().toLocaleDateString("de-DE",{weekday:"long",year:"numeric",month:"2-digit",day:"2-digit"})} (${today()}). Rolle: ${chef?"Chef":"Mitarbeiter"}.
Aufträge:
${tk||"(keine)"}
${chef?`Zahlen ${ym}: Einnahmen ${eur(ms.ein)}, Ausgaben ${eur(ms.aus)}, offene Aufträge ${list("tickets").filter(t=>OFFEN.includes(t.status)).length}.`:""}
Erlaubte Status: ${STATUS.join(", ")}. Leistungen: ${LEISTUNG.join(", ")}.
Gesagt wurde (kann Erkennungsfehler enthalten): """${txt.slice(0,2000)}"""
Antworte NUR mit JSON:
{"aktion":"${chef?"ticket_neu|":""}notiz|status|problem|frage|unklar","ticket_nr":0,"status":"","text":"bereinigter Notiz-/Problemtext","problem_grund":"eins aus ${PROBLEME.join("|")}","ticket":{"titel":"","leistung":"","kunde_name":"","tel":"","ort":"","adresse":"","termin":"YYYY-MM-DDTHH:MM oder leer","angebot":0,"beschreibung":""},"antwort":"kurze Antwort auf Deutsch an den Nutzer"}
Relative Tage (morgen, Donnerstag) in ein Datum umrechnen. ticket_nr nur aus der Liste. Bei Fragen nur mit den Daten oben antworten.`);
    if(!r)throw new Error("Keine Antwort");vcShow(r);
  }catch(e){$("#vcOut").innerHTML=`<div class="note">KI nicht verfügbar (${esc(e.message||e.code||"Fehler")}).</div>`}
}
function vcShow(r){
  const nr=Number(r.ticket_nr)||0,t=list("tickets").find(x=>Number(x.nr)===nr),o=$("#vcOut");st.vc=r;st.vcId=t?._id||null;
  const a=r.aktion;
  if(a==="ticket_neu"&&isChef()){const x=r.ticket||{};st.vcPre={titel:x.titel||"",leistung:LEISTUNG.includes(x.leistung)?x.leistung:"Entrümpelung",quelle:"Telefon",kunde:{name:x.kunde_name||"",tel:x.tel||"",ort:x.ort||"",adresse:x.adresse||""},termin:x.termin||"",angebot:num(x.angebot)||null,beschreibung:x.beschreibung||""};
    o.innerHTML=`<div class="card"><h3>Neues Ticket</h3><div class="small">${esc([x.titel,x.kunde_name,x.adresse||x.ort,x.termin&&fDT(x.termin)].filter(Boolean).join(" · "))}</div><button class="btn pri big" style="margin-top:10px" data-act="vcDo">Prüfen und anlegen</button></div>`;return}
  if(["notiz","status","problem"].includes(a)&&!t){o.innerHTML=`<div class="note">Welcher Auftrag? Bitte die Auftragsnummer sagen.${r.antwort?"<br>"+esc(r.antwort):""}</div>`;return}
  if(a==="notiz")o.innerHTML=`<div class="card"><h3>Notiz zu #${esc(t.nr)}</h3><div>${esc(r.text)}</div><button class="btn pri big" style="margin-top:10px" data-act="vcDo">Speichern</button></div>`;
  else if(a==="status"){if(!STATUS.includes(r.status)){o.innerHTML=`<div class="note">Status nicht verstanden.</div>`;return}o.innerHTML=`<div class="card"><h3>#${esc(t.nr)}: ${esc(t.status)} → ${esc(r.status)}</h3><button class="btn pri big" style="margin-top:10px" data-act="vcDo">Bestätigen</button></div>`}
  else if(a==="problem")o.innerHTML=`<div class="card"><h3>Problem zu #${esc(t.nr)}</h3><div>${esc(r.problem_grund||"")}${r.text?" – "+esc(r.text):""}</div><button class="btn pri big" style="margin-top:10px" data-act="vcDo">Weiter</button></div>`;
  else o.innerHTML=`<div class="card"><div style="white-space:pre-wrap">${esc(r.antwort||"Das habe ich nicht verstanden.")}</div></div>`;
}
async function vcDo(){
  const r=st.vc,id=st.vcId;if(!r)return;
  if(r.aktion==="ticket_neu"){newTicket(st.vcPre);return}
  if(r.aktion==="notiz"){await logT(id,"Notiz (Sprache): "+r.text);toast("Notiz gespeichert");openTicket(id);return}
  if(r.aktion==="status"){closeSheet();await setStatus(id,r.status);return}
  if(r.aktion==="problem"){problemDialog(id,{grund:PROBLEME.includes(r.problem_grund)?r.problem_grund:"Sonstiges",text:r.text});return}
}

/* ===================== NEU 2: Mahnwesen, Vollmacht, Nachkalkulation ===================== */
const PDF_END=262; /* Inhalt endet hier – darunter steht die Fußzeile */
const zahlZiel=()=>Number(st.firma.zahlungsziel)||14;
const addDays=(iso,n)=>{const d=new Date(String(iso).slice(0,10)+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
/* Absenderzeile über der Kundenadresse (wie im Geschäftsbrief) */
function absender(d,y){const f=st.firma,l=[f.name||"WN Entrümpelung",f.strasse,[f.plz,f.ort].filter(Boolean).join(" ")].filter(Boolean).join(" · ");d.setFontSize(7);d.setTextColor(110);d.text(l,16,y);d.setDrawColor(170);d.line(16,y+1,16+Math.min(d.getTextWidth(l),100),y+1);d.setDrawColor(0);d.setTextColor(0);d.setFontSize(10);return y+5.5}

/* ---------- Mahnwesen ---------- */
const MAHN=["Zahlungserinnerung","1. Mahnung","2. Mahnung (letzte)"];
function offeneRechnungen(){return list("tickets").filter(t=>t.rechnung&&t.status!=="Bezahlt"&&t.status!=="Abgelehnt").map(t=>{const m=t.mahnungen||[],last=m[m.length-1],faellig=last?last.frist:addDays(t.rechnung.datum,zahlZiel());return{t,stufe:m.length,faellig,ueber:Math.floor((new Date(today()+"T12:00:00")-new Date(faellig+"T12:00:00"))/864e5),betrag:(t.rechnung.kalk?.zahlbetrag||t.angebot||0)+m.reduce((s,x)=>s+(+x.gebuehr||0),0)}}).sort((a,b)=>b.ueber-a.ueber)}
function mahnCard(){
  const o=offeneRechnungen(),ue=o.filter(x=>x.ueber>0);
  return `<div class="card"><div class="spread"><h3>Offene Rechnungen</h3><span class="small">${o.length} offen${ue.length?` · <b style="color:#f59e0b">${ue.length} überfällig</b>`:""}</span></div>
  ${o.length?`<div class="list" style="margin-top:10px">${o.map(x=>`<div class="item" style="cursor:default"><div class="head"><b>${esc(x.t.rechnung.nr)} · ${esc(x.t.kunde?.name||"")}</b><b style="font-weight:600">${eur(x.betrag)}</b></div>
   <div class="meta">${x.ueber>0?`<span style="color:#f59e0b">seit ${x.ueber} Tag${x.ueber>1?"en":""} überfällig</span>`:`fällig am ${esc(fD(x.faellig))}`}${x.stufe?` · zuletzt: ${esc(MAHN[x.stufe-1])} (${esc(fD(x.t.mahnungen[x.stufe-1].datum))})`:""}</div>
   <div class="row" style="margin-top:4px">${x.stufe<3?`<button class="btn sm ${x.ueber>0?"pri":""}" data-act="mahn" data-id="${esc(x.t._id)}">${esc(MAHN[x.stufe])} erstellen</button>`:`<span class="small">Alle Mahnstufen versendet – ggf. Inkasso oder gerichtliches Mahnverfahren.</span>`}<button class="btn sm" data-act="openTicket" data-id="${esc(x.t._id)}">Auftrag</button></div></div>`).join("")}</div>`:`<div class="small" style="margin-top:6px">Keine offenen Rechnungen.</div>`}</div>`;
}
async function mahnGo(id){
  const t=st.data.tickets[id];if(!t?.rechnung){toast("Keine Rechnung vorhanden");return}
  const m=t.mahnungen||[],stufe=m.length;if(stufe>=3){toast("Alle Mahnstufen sind schon versendet");return}
  const geb=stufe>=1?(Number(st.firma.mahngebuehr)||0):0,frist=addDays(today(),stufe===2?5:7),re=t.rechnung,k=re.kalk||{};
  const vorher=m.reduce((s,x)=>s+(+x.gebuehr||0),0),offen=r2((k.zahlbetrag||t.angebot||0)+vorher+geb),titel=MAHN[stufe];
  toast(titel+" wird erstellt …");await loadJsPdf();const {jsPDF}=window.jspdf,d=new jsPDF({unit:"mm",format:"a4"}),M=16,W=210,CW=W-2*M;
  let y=await pdfHead(d,`${titel} zu Rechnung ${re.nr}`,`Datum ${fD(today())}`);y=kundeBlock(d,t,y);
  const P=(s,size=10)=>{d.setFontSize(size);for(const l of d.splitTextToSize(s,CW)){if(y>PDF_END){d.addPage();y=20}d.text(l,M,y);y+=size*.42+.8}};
  const kn=String(t.kunde?.name||"").trim(),anrede=/^herr\b/i.test(kn)?`Sehr geehrter ${kn},`:/^frau\b/i.test(kn)?`Sehr geehrte ${kn},`:kn?`Guten Tag ${kn},`:"Sehr geehrte Damen und Herren,";
  P(anrede);y+=2;
  P(stufe===0?`sicher ist es Ihrer Aufmerksamkeit entgangen: Für unsere Leistung „${[t.leistung,t.titel].filter(Boolean).join(" – ")}“ (Rechnung ${re.nr} vom ${fD(re.datum)}) konnten wir noch keinen Zahlungseingang feststellen. Bitte überweisen Sie den offenen Betrag bis zum ${fD(frist)}. Falls Sie bereits bezahlt haben, betrachten Sie dieses Schreiben bitte als gegenstandslos.`
    :stufe===1?`leider haben wir trotz unserer Zahlungserinnerung vom ${fD(m[0].datum)} noch keinen Zahlungseingang für Rechnung ${re.nr} vom ${fD(re.datum)} erhalten. Wir bitten Sie, den offenen Betrag bis spätestens ${fD(frist)} zu überweisen.`
    :`trotz Zahlungserinnerung und Mahnung ist Rechnung ${re.nr} vom ${fD(re.datum)} weiterhin offen. Dies ist unsere letzte Mahnung. Bitte überweisen Sie den offenen Betrag bis spätestens ${fD(frist)}. Andernfalls müssen wir die Forderung ohne weitere Ankündigung an ein Inkassounternehmen übergeben oder das gerichtliche Mahnverfahren einleiten. Die dadurch entstehenden Kosten gehen zu Ihren Lasten.`);
  y+=4;const R=(l,v,b)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(10);d.text(l,M+2,y);d.text(v,W-M-2,y,{align:"right"});y+=5.5};
  d.setFillColor(238,242,248);d.rect(M,y-4.5,CW,6.5,"F");R(`Rechnung ${re.nr} vom ${fD(re.datum)}`,eur(k.zahlbetrag||t.angebot||0));
  m.forEach((x,i)=>{if(x.gebuehr)R(`Mahngebühr (${MAHN[i]})`,eur(x.gebuehr))});if(geb)R(`Mahngebühr (${titel})`,eur(geb));
  d.line(W-M-70,y-3,W-M,y-3);R("Offener Betrag",eur(offen),true);d.setFont("helvetica","normal");y+=3;
  const f=st.firma;P(`Bitte überweisen Sie ${eur(offen)} bis ${fD(frist)}${f.iban?` auf IBAN ${f.iban}${f.bank?` (${f.bank})`:""}`:""}, Verwendungszweck ${re.nr}.`);y+=3;
  P("Bei Fragen erreichen Sie uns gerne telefonisch oder per WhatsApp.");y+=4;P("Mit freundlichen Grüßen");y+=1;P(f.inhaber||f.name||"WN Entrümpelung");
  pdfFoot(d,`${titel} ${re.nr}`);
  if(!await savePdf(d,`${titel.replace(/[^\wäöü]+/gi,"_")}_${re.nr}_${fileSafe(t.kunde?.name||"Kunde")}.pdf`))return;
  await logT(id,`${titel} erstellt (Frist ${fD(frist)}, offen ${eur(offen)})`,{mahnungen:[...m,{stufe:stufe+1,datum:today(),frist,gebuehr:geb,von:st.me}]});
  const wa=`${anrede.replace(/,$/,"")}\n\n${stufe===0?`kurze Erinnerung: Rechnung ${re.nr} über ${eur(offen)} ist noch offen.`:stufe===1?`Rechnung ${re.nr} ist trotz Erinnerung noch offen (jetzt ${eur(offen)}).`:`letzte Mahnung: Rechnung ${re.nr} über ${eur(offen)} ist weiterhin offen.`} Bitte überweisen Sie bis ${fD(frist)}${f.iban?` auf IBAN ${f.iban}`:""}, Verwendungszweck ${re.nr}. Das Schreiben als PDF schicken wir Ihnen gleich mit.\n\nViele Grüße\n${f.name||"WN Entrümpelung"}`;
  openSheet(`<div class="spread"><h2>${esc(titel)} versenden</h2><button class="btn sm" data-act="close">Schließen</button></div>
  <p class="small">Das PDF wurde gespeichert. Schicken Sie es per WhatsApp oder E-Mail an den Kunden (PDF im Chat anhängen).</p>
  <div class="field"><textarea id="mh_t" style="min-height:160px">${esc(wa)}</textarea></div>
  ${t.kunde?.tel?`<a class="btn pri big" id="mhWa" target="_blank" rel="noopener" href="${esc(waLink(t.kunde.tel,wa))}">Per WhatsApp senden</a>`:`<div class="note">Keine Telefonnummer beim Kunden – Text kopieren und per Post/E-Mail senden.</div>`}<button class="btn" data-act="copyEl" data-el="mh_t">Text kopieren</button>`);
  const s=()=>{const a=$("#mhWa");if(a)a.href=waLink(t.kunde.tel,$("#mh_t").value)};$("#mh_t").oninput=s;
}

/* ---------- Nachkalkulation & KI-Lernfaktor ---------- */
function nachCalc(t){
  const n=t.nach||{},p=preise(),satz=mwstSatzFirma();
  const erl=r2(t.rechnung?.kalk?.netto??t.kalk?.netto??((t.preisFinal??t.angebot??0)/(1+satz/100)));
  const lohn=r2((num(n.personen)||0)*(num(n.stunden)||0)*(p.lohn||20));
  const bel=r2(aktiv("belege").filter(b=>b.ticketId===t._id).reduce((s,b)=>s+((+b.brutto||0)-(+b.mwst||0)),0));
  const sonst=r2(num(n.sonst)||0),kosten=r2(lohn+bel+sonst),db=r2(erl-kosten);
  const kiM3=t.kiVol?.m3||t.kalk?.m3||null,abw=n.m3&&kiM3?(kiM3-n.m3)/n.m3:null;
  return{erl,lohn,bel,sonst,kosten,db,marge:erl?db/erl:null,proStd:n.stunden&&n.personen?db/(n.personen*n.stunden):null,proM3:n.m3?erl/n.m3:null,m3:n.m3,kiM3,abw};
}
/* Wie genau war die KI bisher? Faktor = echte m³ / KI-m³ (Median, ab 3 Aufträgen) */
function kiFaktor(){const r=list("tickets").filter(t=>t.nach?.m3&&t.kiVol?.m3).map(t=>t.nach.m3/t.kiVol.m3).sort((a,b)=>a-b);if(r.length<3)return null;const m=r[Math.floor(r.length/2)];return{f:Math.round(m*100)/100,n:r.length}}

async function pdfWiderruf(d,t,y,newPage){
  const W=recht()?.widerruf(docLang(t),firmaRecht());if(!W)return y;const M=16,CW=210-2*M;
  if(newPage){d.addPage();y=20}
  const P=(s,size=9.5,b)=>{d.setFont("helvetica",b?"bold":"normal");d.setFontSize(size);for(const l of d.splitTextToSize(s,CW)){if(y>PDF_END){d.addPage();y=20}d.text(l,M,y);y+=size*.42+.7}d.setFont("helvetica","normal")};
  P(W.titel,13,true);y+=2;for(const a of W.abschnitte){P(a.h,10.5,true);a.p.forEach(p=>{P(p);y+=1.2});y+=1.5}
  y+=3;d.setDrawColor(150);d.setLineDashPattern([1,1],0);d.line(M,y,210-M,y);d.setLineDashPattern([],0);y+=6;
  P(W.formularTitel,12,true);y+=1;W.formular.forEach(p=>{P(p,9.5);y+=2.2});return y;
}

function kasseDoc(){return st.kasse||{}}
function kasseZeilen(y){
  const k=kasseDoc(),z=[];
  aktiv("einnahmen").filter(e=>e.zahlart==="Bar"&&String(e.datum).startsWith(y)).forEach(e=>z.push({datum:e.datum,text:e.beschreibung||"Einnahme",ein:+e.brutto||0,aus:0,beleg:e.rechnungNr||""}));
  aktiv("belege").filter(b=>b.zahlart==="Bar"&&String(b.datum).startsWith(y)).forEach(b=>z.push({datum:b.datum,text:[b.haendler,b.notiz].filter(Boolean).join(" – ")||"Ausgabe",ein:0,aus:(+b.brutto||0)+(+b.privat||0),beleg:"Beleg"}));
  (k.bewegungen||[]).filter(m=>String(m.datum).startsWith(y)).forEach(m=>z.push({datum:m.datum,text:m.text,ein:m.art==="ein"?+m.betrag:0,aus:m.art==="aus"?+m.betrag:0,beleg:m.art==="ein"?"Einlage/Bank":"Entnahme/Bank"}));
  z.sort((a,b)=>String(a.datum).localeCompare(b.datum));let s=+(k.start?.[y]||0);z.forEach(x=>{s=r2(s+x.ein-x.aus);x.saldo=s});return{start:+(k.start?.[y]||0),zeilen:z,ende:s};
}

function homography(src,dst){ // maps dst -> src
  const A=[],b=[]; for(let i=0;i<4;i++){ const [x,y]=dst[i],[u,v]=src[i]; A.push([x,y,1,0,0,0,-u*x,-u*y]); b.push(u); A.push([0,0,0,x,y,1,-v*x,-v*y]); b.push(v); }
  for(let c=0;c<8;c++){ let m=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[m][c])) m=r; [A[c],A[m]]=[A[m],A[c]]; [b[c],b[m]]=[b[m],b[c]]; const p=A[c][c]||1e-12; for(let r=0;r<8;r++){ if(r===c) continue; const f=A[r][c]/p; if(!f) continue; for(let k=c;k<8;k++) A[r][k]-=f*A[c][k]; b[r]-=f*b[c]; } }
  return b.map((v,i)=>v/A[i][i]).concat(1);
}
function warpDoc(img,q){ // q: 4 Punkte in Bildpixeln, Reihenfolge oben-links, oben-rechts, unten-rechts, unten-links (Leserichtung)
  const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let w=Math.max(dist(q[0],q[1]),dist(q[3],q[2])), h=Math.max(dist(q[0],q[3]),dist(q[1],q[2]));
  const s=Math.min(1,2000/Math.max(w,h)); w=Math.max(40,Math.round(w*s)); h=Math.max(40,Math.round(h*s));
  const sc=document.createElement("canvas"); sc.width=img.width; sc.height=img.height; const sg=sc.getContext("2d",{willReadFrequently:true}); sg.drawImage(img,0,0);
  const sd=sg.getImageData(0,0,img.width,img.height).data, SW=img.width, SH=img.height;
  const M=homography(q,[[0,0],[w,0],[w,h],[0,h]]);
  const oc=document.createElement("canvas"); oc.width=w; oc.height=h; const og=oc.getContext("2d"); const od=og.createImageData(w,h), o=od.data;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const z=M[6]*x+M[7]*y+1, u=(M[0]*x+M[1]*y+M[2])/z, v=(M[3]*x+M[4]*y+M[5])/z;
    const x0=Math.floor(u), y0=Math.floor(v), fx=u-x0, fy=v-y0, i=(y*w+x)*4;
    if(x0<0||y0<0||x0>=SW-1||y0>=SH-1){ o[i]=o[i+1]=o[i+2]=255; o[i+3]=255; continue; }
    const a=(y0*SW+x0)*4, b=a+4, c=a+SW*4, d=c+4;
    for(let ch=0;ch<3;ch++) o[i+ch]=(sd[a+ch]*(1-fx)+sd[b+ch]*fx)*(1-fy)+(sd[c+ch]*(1-fx)+sd[d+ch]*fx)*fy;
    o[i+3]=255;
  }
  // Kontrast: 2 %–98 % Helligkeit auf volle Spanne
  const hist=new Array(256).fill(0); for(let i=0;i<o.length;i+=4) hist[(o[i]*0.299+o[i+1]*0.587+o[i+2]*0.114)|0]++;
  const N=w*h; let acc=0,lo=0,hi=255; for(let i=0;i<256;i++){ acc+=hist[i]; if(acc>N*0.02){lo=i;break;} } acc=0; for(let i=255;i>=0;i--){ acc+=hist[i]; if(acc>N*0.02){hi=i;break;} }
  if(hi-lo>40){ const f=255/(hi-lo); for(let i=0;i<o.length;i+=4) for(let ch=0;ch<3;ch++) o[i+ch]=Math.max(0,Math.min(255,(o[i+ch]-lo)*f)); }
  og.putImageData(od,0,0); return oc;
}
function rotateCanvas(src,deg){ const r=((deg%360)+360)%360; if(!r) return src; const c=document.createElement("canvas"); c.width=r%180?src.height:src.width; c.height=r%180?src.width:src.height; const g=c.getContext("2d"); g.translate(c.width/2,c.height/2); g.rotate(r*Math.PI/180); g.drawImage(src,-src.width/2,-src.height/2); return c; }
const canvasBlob=c=>new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",0.86));
async function docFix(file){
  try{
    const small=await compress(file,1600); const img=await loadImg(small);
    const W=img.width,H=img.height; let loc=localQuad(img);
    let ai=null;
    if(st.sample&&!window.__wnKiLangsam){ const r=await aiJson(`Auf dem Foto ist ein Dokument (Kassenbon, Rechnung, Vertragsseite, Brief oder Zähler). Es kann schief, seitlich oder auf dem Kopf liegen.
Gib die 4 Ecken des Dokuments als Bruchteile der Bildbreite/-höhe (0 bis 1, Ursprung oben links im Bild) an – und zwar in der Reihenfolge, wie man das Dokument aufrecht liest: [oben-links, oben-rechts, unten-rechts, unten-links] des TEXTES. Liegt das Dokument z. B. auf dem Kopf, ist "oben-links" des Textes im Bild unten rechts.
Antworte nur mit JSON: {"dokument":true oder false,"ecken":[[x,y],[x,y],[x,y],[x,y]],"drehung":0|90|180|270 (Grad im Uhrzeigersinn, um die der Text gedreht ist)}`,[small]); ai=r.v||null; }
    const ok=e=>Array.isArray(e)&&e.length===4&&e.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==="number"&&n>=-0.05&&n<=1.05));
    let q=null, rot=0;
    if(ai&&ai.dokument!==false&&ok(ai.ecken)){
      const E=ai.ecken.map(p=>[Math.min(1,Math.max(0,p[0])),Math.min(1,Math.max(0,p[1]))]);
      if(loc){ // genaue lokale Ecken in KI-Reihenfolge bringen
        const used=new Set(); const m=E.map(p=>{ let bi=-1,bd=9; loc.forEach((l,i)=>{ if(used.has(i)) return; const d=Math.hypot(l[0]-p[0],l[1]-p[1]); if(d<bd){bd=d;bi=i;} }); used.add(bi); return {i:bi,d:bd}; });
        const cyc=m.map(x=>x.i), okCyc=[0,1,2,3].some(s=>cyc.every((v,j)=>v===(s+j)%4));
        q=okCyc&&m.every(x=>x.d<0.18)?cyc.map(i=>loc[i]):E;
      } else q=E;
    } else if(loc){ q=loc; rot=[0,90,180,270].includes(ai?.drehung)?ai.drehung:0; }
    if(!q) return {blob:small,changed:false};
    const cx=q.reduce((s,p)=>s+p[0],0)/4, cy=q.reduce((s,p)=>s+p[1],0)/4;
    const px=q.map(p=>[(cx+(p[0]-cx)*1.015)*W,(cy+(p[1]-cy)*1.015)*H].map((v,i)=>Math.max(0,Math.min(i?H-1:W-1,v))));
    let c=warpDoc(img,px); if(rot) c=rotateCanvas(c,-rot);
    return {blob:await canvasBlob(c),changed:true,orig:small};
  }catch(e){ console.warn("docFix",e); return {blob:file,changed:false}; }
}
async function rotateBlob(b,deg){ const img=await loadImg(b); const c=document.createElement("canvas"); c.width=img.width; c.height=img.height; c.getContext("2d").drawImage(img,0,0); return canvasBlob(rotateCanvas(c,deg)); }

function scanPages({multi=false,title="Scannen",tip=""}={}){
  return new Promise(res=>{
    const pages=[]; let done=false;
    const fin=v=>{ if(done) return; done=true; SCAN_RES=null; pages.forEach(p=>p.u&&URL.revokeObjectURL(p.u)); res(v); };
    openSheet(`<div class="spread"><h2>${esc(title)}</h2><button class="btn sm" id="scX">Abbrechen</button></div>
    ${tip?`<div class="small">${esc(tip)}</div>`:""}
    <div class="scan-strip${multi?"":" one"}" id="scStrip"></div>
    <label class="btn ${multi?"pri":"pri"} scan-cam" for="scCam" id="scCamB">${CAMSVG}<span id="scCamL">Kamera öffnen</span></label>
    <input id="scCam" class="hide" type="file" accept="image/*" capture="environment">
    <div class="row" style="justify-content:space-between;align-items:center"><label class="btn sm" for="scGal">Aus Galerie / Dateien wählen</label><input id="scGal" class="hide" type="file" accept="image/*"${multi?" multiple":""}>
    <button class="btn pri" id="scDone" disabled>${multi?"Fertig":"Übernehmen"}</button></div>
    <div class="small">Wird automatisch gerade gerückt, zugeschnitten und gedreht. Tipp: Dokument auf einen dunklen Untergrund legen, gutes Licht.</div>`);
    SCAN_RES=()=>fin([]);
    const busy=()=>pages.some(p=>p.busy);
    const paint=()=>{ const el=$("#scStrip"); if(!el) return;
      el.innerHTML=pages.map((p,i)=>`<div class="sp${p.busy?" busy":""}">${p.u?`<img src="${p.u}" alt="Seite ${i+1}">`:""}${p.busy?`<div class="spin-w"><div class="spin"></div><small>wird gerade gerückt …</small></div>`:""}<span>${multi?i+1:(p.changed?"✓ ausgerichtet":"Original")}</span>${p.busy?"":`<button class="rb rot" data-rot="${i}" aria-label="Drehen">↻</button>${p.orig?`<button class="rb org" data-org="${i}" aria-label="Original">${p.useOrig?"Auto":"Orig."}</button>`:""}`}<button class="rb del" data-del="${i}" aria-label="Seite entfernen">×</button></div>`).join("");
      el.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const [p]=pages.splice(+b.dataset.del,1); p.u&&URL.revokeObjectURL(p.u); paint(); });
      el.querySelectorAll("[data-rot]").forEach(b=>b.onclick=async()=>{ const p=pages[+b.dataset.rot]; p.busy=true; paint(); p.cur=await rotateBlob(p.cur,90); if(p.u) URL.revokeObjectURL(p.u); p.u=URL.createObjectURL(p.cur); p.busy=false; paint(); });
      el.querySelectorAll("[data-org]").forEach(b=>b.onclick=()=>{ const p=pages[+b.dataset.org]; p.useOrig=!p.useOrig; [p.cur,p.alt]=[p.alt,p.cur]; if(p.u) URL.revokeObjectURL(p.u); p.u=URL.createObjectURL(p.cur); paint(); });
      const d=$("#scDone"); d.disabled=!pages.length||busy();
      if(multi){ $("#scCamL").textContent=pages.length?`Seite ${pages.length+1} fotografieren`:"Kamera öffnen"; d.textContent=pages.length?`Fertig (${pages.length} ${pages.length>1?"Seiten":"Seite"})`:"Fertig"; }
      else { $("#scCamL").textContent=pages.length?"Neu fotografieren":"Kamera öffnen"; $("#scCamB").classList.toggle("pri",!pages.length); }
    };
    const add=fs=>{ if(!multi){ pages.forEach(p=>p.u&&URL.revokeObjectURL(p.u)); pages.length=0; fs=fs.slice(0,1); }
      for(const f of fs){ const p={busy:true,cur:f,u:URL.createObjectURL(f)}; pages.push(p);
        docFix(f).then(r=>{ if(done) return; p.cur=r.blob; p.changed=r.changed; if(r.changed){ p.orig=true; p.alt=r.orig; } URL.revokeObjectURL(p.u); p.u=URL.createObjectURL(p.cur); p.busy=false; paint(); }); }
      paint(); };
    $("#scCam").onchange=e=>{ add([...e.target.files]); e.target.value=""; };
    $("#scGal").onchange=e=>{ add([...e.target.files]); e.target.value=""; };
    $("#scX").onclick=()=>closeSheet();
    $("#scDone").onclick=()=>{ if(busy()) return; const out=pages.map(p=>p.cur); closeSheet(); fin(out); };
  });
}

/* ---------- Beleg-KI wie JoumHome: Positionen, unsicher, Lernregeln, Zuordnung zum Auftrag, Miete erkennen ---------- */

const PRIV_BSP_WN="Zigaretten/Tabak, Kaugummi, Süßigkeiten, Snacks, Getränke, Kaffee to go, belegte Brötchen, Zeitschriften, Lotto, Kosmetik, Drogerie für den Eigenbedarf, Medikamente, private Lebensmittel, Kleidung ohne Arbeitsschutz, Spielzeug, Geschenke, Gutscheine, Pfand für private Getränke";
const MIET_RE_WN=/\b(transporter|anh[äa]nger|mietwagen|sprinter|kleinbus|lkw|vermietung|mietger[äa]t|leihger[äa]t|container|sixt|europcar|enterprise|hertz|starcar|buchbinder|toom.?mietpark|obi.?mietservice)\b/i;
const DEPO_RE_WN=/\b(wertstoffhof|deponie|recyclinghof|abfall|entsorgung|awb|milieustraat|afval|schrott|sperrm[üu]ll)\b/i;
function posKey(t){return String(t||"").toLowerCase().replace(/[0-9.,x*€%]+/g," ").replace(/\s+/g," ").trim().slice(0,40)}
function belegRegeln(){let lok={};try{lok=JSON.parse(localStorage.getItem("wn_belegregeln")||"{}")}catch(e){}return{...(st.bregeln?.r||{}),...lok}}
function posRegelnTxt(){const e=Object.entries(belegRegeln()).slice(-60);return e.length?`\nFrühere Korrekturen – genau so übernehmen: ${e.map(([k,v])=>`"${k}" = ${v==="p"?"privat":"betrieblich"}`).join("; ")}.`:""}
async function posLearn(P){
  const k=(P||[]).filter(p=>p.korr&&posKey(p.text));if(!k.length)return;
  const r={...belegRegeln()};k.forEach(p=>{const key=posKey(p.text);delete r[key];r[key]=p.privat?"p":"b"});
  const e=Object.fromEntries(Object.entries(r).slice(-80));
  try{localStorage.setItem("wn_belegregeln",JSON.stringify(e))}catch(x){}
  if(isChef()&&st.db){try{await st.db.doc("einstellungen/belegregeln").set({r:e,t:nowIso()});st.bregeln={r:e}}catch(x){}}
}
function belegTicketListe(){const g=addDays(today(),-60);return list("tickets").filter(t=>OFFEN.includes(t.status)||t.status==="Erledigt"||String(t.termin||t.erstellt||"").slice(0,10)>=g).sort((a,b)=>b.nr-a.nr).slice(0,40)}
const BELEG_PROMPT2=()=>`Auf dem Foto (ggf. mehrere Seiten) ist ein Kassenbon oder eine Rechnung (Deutschland oder Niederlande). Eine Entrümpelungsfirma hat damit für ihre Arbeit eingekauft. Es können private Artikel dabei sein, die steuerlich NICHT als Betriebsausgabe gelten dürfen.
Antworte nur mit einem JSON-Objekt:
{"datum":"YYYY-MM-DD oder null","haendler":"Name des Geschäfts","gesamt":Gesamtbetrag brutto des ganzen Bons,"positionen":[{"text":"Artikel wie auf dem Bon, Abkürzungen verständlich ausgeschrieben","brutto":Zeilenbetrag brutto (Menge × Preis, Rabatt abgezogen),"mwst_satz":19|7|0|21|9,"kategorie":"genau einer aus ${KAT.join("|")}","privat":true/false,"unsicher":true/false,"grund":"kurz, warum privat – nur wenn privat"}],"notiz":"kurz, was gekauft wurde (ohne Privates)","miete":true/false,"mietArt":"z. B. Transporter, Anhänger, Container – oder null","entsorgung":true/false,"ticketNr":Nummer des passenden Auftrags oder null,"ticketGrund":"kurz warum – oder null"}
Regeln:
- privat=true bei allem, was eine Entrümpelungsfirma nicht für ihre Arbeit braucht, z. B. ${PRIV_BSP_WN}.
- Betrieblich: Kraftstoff/AdBlue → Kraftstoff; Öl, Scheibenwasser, Wäsche, Reparatur → Fahrzeug (Reparatur/Wartung); Müllsäcke, Folie, Klebeband, Kartons, Handschuhe, Arbeitsschutz → Material/Verbrauch; Werkzeug → Werkzeug/Geräte; Deponie/Wertstoffhof → Entsorgung/Deponie; Miete von Transporter/Anhänger/Container → Fahrzeugmiete (Transporter/Anhänger).
- unsicher=true, wenn ein Artikel privat oder betrieblich sein kann (z. B. Wasserflaschen für das Team, Batterien) – dann privat=false lassen.
- Jede gekaufte Zeile genau einmal. Pfand und Rabatte zum zugehörigen Artikel. Zwischensumme, Summe, Zahlungsart, MwSt-Tabelle, Rückgeld NICHT als Position. Bei Dienstleistungsrechnung (z. B. Deponie, Vermietung) reicht eine Position.
- MwSt-Satz je Zeile aus dem Bon (Kennbuchstaben A/B, NL 21/9 %). Zahlen mit Punkt.
- miete=true bei Miete von Fahrzeug oder Gerät (Transporter, Anhänger, Container, Mietgerät). entsorgung=true bei Wertstoffhof/Deponie/Entsorger.
- ticketNr nur, wenn der Beleg erkennbar zu einem dieser Aufträge passt (gleiches Datum wie Termin, gleicher Ort, Deponie nach einer Räumung, Transporter für diesen Auftrag), sonst null. Aufträge: ${belegTicketListe().map(t=>`#${t.nr} ${t.titel||t.leistung||""}, ${t.kunde?.ort||""}${t.termin?", Termin "+String(t.termin).slice(0,10):""} (${t.status})`).join("; ")||"keine"}${posRegelnTxt()}`;

let S_RES=[];
function sRun(q){
  const box=$("#sres");if(!box)return;const toks=nrm(q).split(/\s+/).filter(Boolean);

  const all=sIndex().filter(r=>toks.every(t=>r.k.includes(t)));
  all.forEach(r=>{r.sc=(r.tn.startsWith(toks[0])?3:0)+(toks.every(t=>r.tn.includes(t))?2:0)+(r.g==="Funktionen"?.5:0)});
  all.sort((a,b)=>b.sc-a.sc);
  const by={},order=[];for(const r of all){if(!by[r.g]){by[r.g]=[];order.push(r.g)}if(by[r.g].length<6)by[r.g].push(r)}

  box.querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>{const r=S_RES[+b.dataset.si];closeSheet();try{r.run()}catch(e){console.error(e)}});
